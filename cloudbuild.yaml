steps:
  # 1. Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/summer-event-reg/summer-camp-app:latest', '.']

  # 2. 빌드된 이미지를 Container Registry에 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/summer-event-reg/summer-camp-app:latest']

  # 3. Cloud Run 서비스로 최신 버전 배포 실행
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'summer-camp-app'
      - '--image'
      - 'gcr.io/summer-event-reg/summer-camp-app:latest'
      - '--region'
      - 'asia-northeast3'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # 비밀 값은 Secret Manager에서 주입합니다. (처음 한 번 비밀 생성 필요 — SECURITY_UPDATE.md 참고)
      - '--update-secrets'
      - 'SESSION_SECRET=evt-session-secret:latest,SUPER_ADMIN_PASSWORD=evt-super-admin-password:latest'

images:
  - 'gcr.io/summer-event-reg/summer-camp-app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  # 빌드 컴퓨터 환경: 2027-03-28부터 기본값이 될 'regular' 채널을 미리 사용 (문제 시 이 줄만 삭제)
  workerRelease: regular
